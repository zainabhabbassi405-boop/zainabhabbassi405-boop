<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280">
<defs>
  <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#5FD3E6" stroke-width="1.6" opacity=".45"/>
  </pattern>
  <pattern id="hatchA" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <line x1="0" y1="0" x2="0" y2="7" stroke="#FFC857" stroke-width="1.6" opacity=".55"/>
  </pattern>
  <style>
    .t{font-family:'Segoe Print','Bradley Hand','Comic Neue','Comic Sans MS','Chalkboard SE',cursive;fill:#E6ECF5}
    .ink{fill:none;stroke:#C9D4EA;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
    .teal{fill:none;stroke:#5FD3E6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .amb{fill:none;stroke:#FFC857;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .red{fill:none;stroke:#D9534F;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>

<rect x="6" y="6" width="408" height="268" rx="18" fill="#0E1430"/>
<g filter="url(#sk)">
  <rect x="6" y="6" width="408" height="268" rx="18" class="ink" stroke-width="1.6" style="stroke:#2A3566"/>
  
  <!-- motor -->
  <rect x="34" y="70" width="88" height="62" rx="10" class="ink" fill="url(#hatch)"/>
  <path d="M122 101 h22" class="ink" stroke-width="5"/><circle cx="152" cy="101" r="8" class="ink"/>
  <path d="M46 70 v-10 M66 70 v-10 M86 70 v-10 M106 70 v-10" class="ink"/>
  <text x="56" y="157" class="t" font-size="13">motor</text>
  <!-- current waveform with fault -->
  <path d="M176 101 q8 -26 16 0 t16 0 t16 0 q5 -44 10 0 t12 0" class="teal"/>
  <path d="M222 62 l10 -14 l10 14 z" class="red" fill="#D9534F" fill-opacity=".15"/>
  <text x="229" y="60" class="t" font-size="12" text-anchor="middle" style="fill:#D9534F">!</text>
  <!-- brain-ish box -->
  <path d="M262 101 h18" class="ink"/><path d="M274 95 l7 6 l-7 6" class="ink"/>
  <rect x="290" y="68" width="62" height="66" rx="12" class="ink"/>
  <path d="M303 84 q10 -8 18 2 q10 -8 18 2 M303 102 q10 -8 18 2 q10 -8 18 2 M303 120 h36" class="teal" stroke-width="2"/>
  <text x="321" y="157" class="t" font-size="13" text-anchor="middle">AI model</text>
  <!-- alarm -->
  <path d="M352 101 h18" class="ink"/>
  <path d="M376 112 q0 -26 12 -26 q12 0 12 26 z" class="red" fill="#D9534F" fill-opacity=".2"/>
  <path d="M370 116 h36" class="ink"/>

</g>
<text x="26" y="232" class="t" font-size="22" font-weight="bold">Predictive Maintenance</text>
<text x="26" y="256" class="t" font-size="14" opacity=".75">Motor drive · Simulink → AI → PLC</text>
<g filter="url(#sk)"><rect x="287.8" y="22" width="106.19999999999999" height="26" rx="13" fill="#5FD3E6" opacity=".14"/>
<rect x="287.8" y="22" width="106.19999999999999" height="26" rx="13" class="teal" stroke-width="1.6"/></g>
<text x="340.9" y="40" class="t" font-size="13" text-anchor="middle" style="fill:#5FD3E6">in progress</text>
</svg>